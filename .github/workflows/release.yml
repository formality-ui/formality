name: Release

# semantic-release analyzes Conventional Commits on every push to main and
# publishes both @formality-ui/core and @formality-ui/react at a SHARED version.
# Fully automatic: no Version Packages PR, no manual version bump. If the
# commits since the last tag contain nothing releasable (only chore/docs/test/
# etc.), semantic-release exits without publishing.
#
# Auth: a granular NPM_TOKEN (GitHub secret) is used -- pnpm publish cannot do
# the OIDC "trusted publisher" exchange, so id-token:write is deliberately
# omitted (it would trip @semantic-release/npm's OIDC path and discard the
# token -> ENEEDAUTH).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push the release commit/tag + create the GitHub release

concurrency: release-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required so semantic-release can read prior tags
          # and compute the commits since the last release.
          fetch-depth: 0

      - name: Setup pnpm
        # Version is read from the `packageManager` field in package.json.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
