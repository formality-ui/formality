name: Release

# Publishes packages to npm automatically when changes land on main.
#
# Flow:
#   1. You make a change + run `pnpm changeset` to describe it (a .changeset/*.md
#      file gets committed alongside your code).
#   2. You push to main. This workflow runs, the changesets/action sees the
#      pending changeset, bumps versions, rewrites workspace deps, and opens a
#      "Version Packages" pull request.
#   3. You merge that PR. This workflow runs again: pnpm build runs, then
#      `changeset publish` publishes any package whose version isn't on npm yet.
#
# npm forbids republishing an existing version, so only packages whose version
# actually changed will publish.
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # open the Version Packages PR + commit version bumps
  pull-requests: write # create/update the Version Packages PR
  id-token: write # npm provenance (optional but recommended)

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build before publish — only the publishable packages. svelte/vue are
      # private WIP and excluded so a broken build there can't block release.
      - name: Build core + react
        run: pnpm --filter @formality-ui/core --filter @formality-ui/react build

      - name: Changesets (version PR or publish)
        uses: changesets/action@v1
        with:
          # `changeset publish` runs `pnpm publish` per public package.
          publish: pnpm changeset publish
          version: pnpm changeset version
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
